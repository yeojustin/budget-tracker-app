{% extends "base.html" %}
{% block content %}
<h2>Edit Transaction</h2>
<form method="POST" action="{{ url_for('edit', idx=idx) }}">
    <label for="type">Type:</label>
    <select name="type" id="type" required>
        <option value="income" {% if tx.type == "income" %}selected{% endif %}>Income</option>
        <option value="expense" {% if tx.type == "expense" %}selected{% endif %}>Expense</option>
    </select><br><br>

    <label for="amount">Amount ($):</label>
    <input type="number" step="0.01" name="amount" id="amount" required value="{{ tx.amount }}"><br><br>

    <label for="category">Category:</label>
    <input type="text" name="category" id="category" required value="{{ tx.category }}"><br><br>

    <label for="description">Description:</label>
    <input type="text" name="description" id="description" required value="{{ tx.description }}"><br><br>

    <label for="date">Date (YYYY-MM-DD HH:MM:SS):</label><br>
    <input type="text" name="date" id="date" required value="{{ tx.date }}"><br><br>

    <button type="submit">Update Transaction</button>
</form>
{% endblock %}
